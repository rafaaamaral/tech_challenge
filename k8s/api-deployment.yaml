apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tech-challenge
  labels:
    app: tech-challenge
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tech-challenge
      component: api
  template:
    metadata:
      labels:
        app: tech-challenge
        component: api
        tags.datadoghq.com/service: tech-challenge-api
        tags.datadoghq.com/env: prod
        tags.datadoghq.com/version: "${IMAGE_TAG}"
      annotations:
        ad.datadoghq.com/api.logs: '[{"source":"csharp","service":"tech-challenge-api"}]'
        ad.datadoghq.com/api.checks: |
          {"http_check":{"init_config":{},"instances":[
            {"name":"tech-challenge-api-live","url":"http://%%host%%:8080/health/live","timeout":3,"tags":["service:tech-challenge-api","check:live"]},
            {"name":"tech-challenge-api-ready","url":"http://%%host%%:8080/health/ready","timeout":5,"tags":["service:tech-challenge-api","check:ready"]}
          ]}}
    spec:
      containers:
        - name: api
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/tech-challenge-api:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: tech-challenge-config
            - secretRef:
                name: tech-challenge-secret
          env:
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: DD_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/env']
            - name: DD_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/version']
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/service']
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(DD_AGENT_HOST):4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: delta
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.uid=$(POD_UID)
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: tech-challenge-secret
                  key: ConnectionStrings__DefaultConnection
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
