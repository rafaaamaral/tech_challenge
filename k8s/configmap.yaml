apiVersion: v1
kind: ConfigMap
metadata:
  name: tech-challenge-config
  namespace: tech-challenge
  labels:
    app: tech-challenge
    component: config
data:
  ASPNETCORE_ENVIRONMENT: Production
  POSTGRES_DB: tech-challenge
  Email__Host: smtp.example.com
  Email__Port: "587"
  Email__From: no-reply@techchallenge.com
  Email__DisplayName: Oficina Mecânica Tech-Challenge
  Email__EnableSsl: "true"
  Email__ApiBaseUrl: http://api.tech-challenge.svc.cluster.local
  Jwt__Issuer: TechChallengeAPI
  Jwt__Audience: TechChallengeAPI
  Jwt__ExpirationMinutes: "60"
