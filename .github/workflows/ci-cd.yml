name: CI/CD Tech Challenge - Production

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: tech-challenge-api
  IMAGE_NAME: tech-challenge-api
  IMAGE_TAG: ${{ github.sha }}
  K8S_NAMESPACE: tech-challenge

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore tech_challenge_fase_1.slnx

      - name: Build solution
        run: dotnet build tech_challenge_fase_1.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tech_challenge_fase_1.slnx --configuration Release --no-build --verbosity normal

  docker-build-and-publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          docker build -f docker/Dockerfile -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

  deploy-kubernetes:
    needs: docker-build-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Apply Kubernetes namespace
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Create Kubernetes secret from AWS Secrets Manager
        run: |
          set -e
          SECRET_JSON="$(aws secretsmanager get-secret-value --secret-id SecretTechChallenge --region ${{ env.AWS_REGION }} --query SecretString --output text)"
          DB_HOST="$(python3 -c 'import json,sys; s=json.loads(sys.argv[1]); print(s.get("host") or s.get("endpoint") or s.get("hostname") or s.get("rds-host") or "")' "$SECRET_JSON")"
          DB_NAME="$(python3 -c 'import json,sys; s=json.loads(sys.argv[1]); print(s.get("dbname") or s.get("database") or s.get("db") or "techchallenge")' "$SECRET_JSON")"
          DB_USER="$(python3 -c 'import json,sys; s=json.loads(sys.argv[1]); print(s.get("username") or s.get("user") or "postgres")' "$SECRET_JSON")"
          DB_PASSWORD="$(python3 -c 'import json,sys; s=json.loads(sys.argv[1]); print(s.get("password") or s.get("passwd") or "")' "$SECRET_JSON")"
          DB_PORT="$(python3 -c 'import json,sys; s=json.loads(sys.argv[1]); print(s.get("port") or "5432")' "$SECRET_JSON")"

          kubectl delete secret tech-challenge-secret -n ${{ env.K8S_NAMESPACE }} --ignore-not-found=true || true
          kubectl create secret generic tech-challenge-secret -n ${{ env.K8S_NAMESPACE }} \
            --from-literal=POSTGRES_USER="$DB_USER" \
            --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
            --from-literal=Email__UserName="" \
            --from-literal=Email__Password="" \
            --from-literal=Jwt__Secret="3b45f6b4b1433e9fb87ec4bceef4501d" \
            --from-literal=ConnectionStrings__DefaultConnection="Host=$DB_HOST;Port=$DB_PORT;Database=$DB_NAME;Username=$DB_USER;Password=$DB_PASSWORD"

      - name: Apply Kubernetes manifests
        run: |
          export AWS_ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
          export AWS_REGION="${{ env.AWS_REGION }}"
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          envsubst '${AWS_ACCOUNT_ID} ${AWS_REGION} ${IMAGE_TAG}' < k8s/api-deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/api-service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl rollout status deployment/api -n ${{ env.K8S_NAMESPACE }} --timeout=300s || (
            echo "Deployment rollout failed. Dumping diagnostics..." &&
            kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide || true &&
            kubectl describe deployment api -n ${{ env.K8S_NAMESPACE }} || true &&
            kubectl logs deployment/api -n ${{ env.K8S_NAMESPACE }} --all-containers || true &&
            exit 1
          )
